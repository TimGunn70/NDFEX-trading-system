name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cmake --version
          c++ --version

      - name: Configure (Debug, ASan + UBSan)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DWARNINGS_AS_ERRORS=ON

      # Tests are built and gated first, and on purpose. They link only the
      # translation units they exercise, so they stay meaningful while the rest
      # of the tree is still mid-rework.
      - name: Build tests
        run: cmake --build build --target test_config --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Build everything
        run: cmake --build build --parallel

